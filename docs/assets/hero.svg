<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Uma Musume Information Platform</title>
  <desc id="desc">Public-opinion analytics for the Uma Musume Pretty Derby community — crawlers, LLM reports, agents, RAG, and Discord.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#c9a027" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a35b4"/>
      <stop offset="1" stop-color="#c9a027"/>
    </linearGradient>
  </defs>
  <style>
    .bg { fill: #f6f1fc; }
    .frame { fill: none; stroke: #e4d7f5; stroke-width: 1; }
    .title { fill: #2a1848; font: 700 56px "Segoe UI", "Helvetica Neue", sans-serif; letter-spacing: 0.5px; }
    .tag { fill: #5d4a78; font: 400 20px "Segoe UI", "Helvetica Neue", sans-serif; }
    .chip { fill: #ffffff; stroke: #e4d7f5; stroke-width: 1; }
    .chip-text { fill: #2a1848; font: 600 16px "Segoe UI", "Helvetica Neue", sans-serif; }
    .gold { fill: #c9a027; }
    .purple { fill: #6a35b4; }
    .rule { stroke: #c9a027; stroke-width: 4; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16121f; }
      .frame { stroke: #3a3150; }
      .title, .chip-text { fill: #f3eefc; }
      .tag { fill: #c4b6d8; }
      .chip { fill: #1f1a2b; stroke: #3a3150; }
    }
  </style>
  <rect class="bg" width="1200" height="360" rx="28"/>
  <rect class="frame" x="0.5" y="0.5" width="1199" height="359" rx="28"/>
  <rect x="0" y="0" width="1200" height="360" rx="28" fill="url(#wash)"/>

  <!-- Mark: track + carrot -->
  <g transform="translate(56,78)">
    <ellipse cx="92" cy="102" rx="92" ry="54" fill="none" stroke="url(#track)" stroke-width="14"/>
    <ellipse cx="92" cy="102" rx="62" ry="32" fill="none" stroke="#c9a027" stroke-width="4" stroke-dasharray="10 12"/>
    <g transform="translate(68,18)">
      <path class="gold" d="M24 28c18 8 28 28 20 48-8 20-30 30-48 22S-12 70-4 50C4 30 16 24 24 28z"/>
      <path class="purple" d="M22 20c6-14 16-20 22-20 2 10-2 18-8 24-8-2-14-2-14-4z"/>
      <path class="purple" d="M14 22c-2-12 4-22 12-24-2 10 0 18 6 24-8 2-14 2-18 0z"/>
    </g>
  </g>

  <text class="title" x="300" y="148">UMA INFO</text>
  <line class="rule" x1="300" y1="168" x2="430" y2="168"/>
  <text class="tag" x="300" y="204">Public-opinion analytics · Pretty Derby community</text>

  <g transform="translate(300,240)">
    <rect class="chip" width="128" height="40" rx="20"/>
    <text class="chip-text" x="64" y="26" text-anchor="middle">Django 5.2</text>
    <rect class="chip" x="140" width="128" height="40" rx="20"/>
    <text class="chip-text" x="204" y="26" text-anchor="middle">Gemini</text>
    <rect class="chip" x="280" width="128" height="40" rx="20"/>
    <text class="chip-text" x="344" y="26" text-anchor="middle">Claude</text>
    <rect class="chip" x="420" width="148" height="40" rx="20"/>
    <text class="chip-text" x="494" y="26" text-anchor="middle">Discord.py</text>
    <rect class="chip" x="580" width="128" height="40" rx="20"/>
    <text class="chip-text" x="644" y="26" text-anchor="middle">FAISS RAG</text>
  </g>
</svg>
